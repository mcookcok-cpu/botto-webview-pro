<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Botto WebView Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body, html { width: 100%; height: 100%; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; }
        
        .card {
            width: 100%; max-width: 380px; padding: 28px;
            background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); text-align: center;
        }
        .logo-box {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: bold; color: white;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
            margin: 0 auto 16px;
        }
        h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        p.subtitle { font-size: 13px; color: #94a3b8; margin-bottom: 24px; line-height: 1.4; }
        
        .input-group { text-align: left; margin-bottom: 16px; }
        label { display: block; font-size: 11px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"] {
            width: 100%; padding: 14px 16px;
            background: #0f172a; border: 1px solid #334155; border-radius: 12px;
            color: white; font-size: 15px; outline: none;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        
        button {
            width: 100%; padding: 14px 16px;
            background: #3b82f6; border: none; border-radius: 12px;
            color: white; font-size: 15px; font-weight: 600; cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            transition: all 0.2s ease; margin-top: 4px;
        }
        button:active { transform: scale(0.98); background: #2563eb; }
        
        #error {
            display: none; color: #f87171; font-size: 12px;
            margin-top: -10px; margin-bottom: 12px; text-align: left;
        }
        .hint {
            margin-top: 20px; font-size: 11px; color: #64748b; line-height: 1.5; text-align: left;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-box">🤖</div>
        <h1>Botto WebView Pro</h1>
        <p class="subtitle">Masukkan alamat server AI lokal Anda untuk memulai.</p>
        
        <div class="input-group">
            <label for="serverUrl">Alamat Server</label>
            <input type="text" id="serverUrl" value="http://192.168.1.100:7777" placeholder="http://192.168.1.100:7777" autocapitalize="off" autocorrect="off" spellcheck="false">
        </div>
        <div id="error">Alamat URL tidak valid. Contoh: http://192.168.1.100:7777</div>
        
        <button id="connectBtn">Hubungkan ke Server</button>

        <div class="hint">
            • Pastikan perangkat berada di jaringan WiFi yang sama dengan server.<br>
            • TTS otomatis menggunakan suara bawaan sistem Android.
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'botto_webview_pro_url';
        const input = document.getElementById('serverUrl');
        const btn = document.getElementById('connectBtn');
        const errorEl = document.getElementById('error');

        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) input.value = saved;

        function normalizeUrl(raw) {
            let v = (raw || '').trim();
            if (!v) return null;
            if (!/^https?:\/\//i.test(v)) v = 'http://' + v;
            try {
                let u = new URL(v);
                return u.origin;
            } catch (e) {
                return null;
            }
        }

        function goToServer() {
            let origin = normalizeUrl(input.value);
            if (!origin) {
                errorEl.style.display = 'block';
                return;
            }
            errorEl.style.display = 'none';
            localStorage.setItem(STORAGE_KEY, origin);
            
            // Navigate directly to the server URL (full screen native webview)
            window.location.href = origin + '/';
        }

        btn.addEventListener('click', goToServer);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') goToServer();
        });
    </script>
</body>
</html>
